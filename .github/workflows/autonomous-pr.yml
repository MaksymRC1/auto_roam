name: Autonomous AI PR Outreach

on:
  schedule:
    # Запуск щодня о 03:00 ночі (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Дозволяє запускати вручну з інтерфейсу GitHub

permissions:
  contents: write # Необхідно для створення гілки
  pull-requests: write # Необхідно для створення Pull Request

jobs:
  run-ai-agent:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Run Autonomous PR Agent (Search + Mass Mail)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_SENDER_NAME: ${{ secrets.SMTP_SENDER_NAME }}
        run: |
          npm run pr:search
          npm run pr:mass

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(pr): update contacts DB and history"
          title: "chore(pr): update contacts DB and history"
          body: "Автоматичне оновлення бази контактів та історії розсилок від AI агента."
          branch: "chore/update-pr-history"
          base: "main"
          author: "AutoRoam AI Agent <actions@github.com>"
          labels: "automated-pr, data-update"
